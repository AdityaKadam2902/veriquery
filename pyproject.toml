[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veriquery"
version = "0.0.1"
description = "Open-source toolkit and benchmark for measuring and enforcing the numerical trustworthiness of AI data agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Aditya" }]
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "pyyaml>=6,<7",
  "duckdb>=1.0,<2",
  "sqlglot>=25",
  "httpx>=0.28.1",
]

[project.optional-dependencies]
api = ["fastapi>=0.110"]

[dependency-groups]
dev = [
  "ruff>=0.5",
  "mypy>=1.10",
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "pre-commit>=3.7",
  "pip-audit>=2.7",
  "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/veriquery"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "golden: golden tests against frozen data",
  "slow: slow tests excluded from smoke runs",
]

[tool.coverage.run]
source = ["veriquery"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
